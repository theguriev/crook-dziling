[package]
name = "crook-dziling"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Crook plugin that rings when a command finishes."
repository = "https://github.com/theguriev/crook-dziling"

[lib]
# `cdylib` is what `wasm32-unknown-unknown` needs to produce a module with
# exports rather than a Rust rlib nothing outside Rust can load.
crate-type = ["cdylib"]

[dependencies]
# The wire, published. Both sides link the same crate on purpose: a format
# written down twice is a format that will disagree with itself.
#
# `0.8` is Cargo's way of writing "plugin ABI 8" — the crate is versioned
# `0.<abi>.<patch>`, and a host loads one ABI and refuses every other by name,
# so what Cargo resolves is exactly the set of releases this can be loaded by.
# It used to be a commit in the terminal's own repository, which is private:
# nobody else could build this, and the registry that builds every plugin from
# source could not either.
crook_plugin_api = "0.8"

[profile.release]
# The module is mostly the six sounds, but the code around them may as well be
# small: this is loaded into every window at startup.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# A guest that unwinds has nowhere to unwind to — the host sees a trap either
# way, and the unwinding machinery is dead weight in the module.
panic = "abort"
