[package]
name = "crook-dziling"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Crook plugin that rings when a command finishes."
repository = "https://github.com/theguriev/crook-dziling"

[lib]
# `cdylib` is what `wasm32-unknown-unknown` needs to produce a module with
# exports rather than a Rust rlib nothing outside Rust can load.
crate-type = ["cdylib"]

[dependencies]
# The wire, from the host's own repository. Both sides link the same crate on
# purpose: a format written down twice is a format that will disagree with
# itself.
#
# A branch moves under a build, which is exactly what a plugin that has to
# agree with its host cannot afford — so this is a commit rather than a branch,
# and it stays on one until there is a reason to move it. The reason this time
# was `Event::Bell`: ringing when an agent finishes a turn needs plugin API 8,
# and the pin spoke 7.
#
# This one is not on `main` yet — it is the head of theguriev/crook#60, which
# is where the event landed. Repoint it at the commit that lands on `main` when
# the pull request is merged.
crook_plugin_api = { git = "https://github.com/theguriev/crook.git", rev = "5f1d855" }

[profile.release]
# The module is mostly the six sounds, but the code around them may as well be
# small: this is loaded into every window at startup.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# A guest that unwinds has nowhere to unwind to — the host sees a trap either
# way, and the unwinding machinery is dead weight in the module.
panic = "abort"
